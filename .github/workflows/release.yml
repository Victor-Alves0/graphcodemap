name: release

# Publishes to PyPI via Trusted Publishing (OIDC) — no API token stored anywhere.
# One-time setup on PyPI: project → Settings → Publishing → add a GitHub trusted
# publisher (owner: Victor-Alves0, repo: graphcodemap, workflow: release.yml,
# environment: pypi). After that, publishing a GitHub Release runs this job.

on:
  release:
    types: [published]
  workflow_dispatch:   # allow a manual run from the Actions tab

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,mcp,l1]"
      - name: Run tests
        run: python -m pytest -q --timeout=180

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install quality and build toolchain
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,quality,mcp,l1]"
      - name: Release quality gate
        run: |
          python -m ruff check src
          python -m mypy
          python -m coverage run -m pytest -q --timeout=180
          python -m coverage report
      - name: Build sdist + wheel
        run: |
          python -m build
          python -m twine check dist/*
      - name: Smoke-test built wheel
        run: |
          python -m venv wheel-smoke
          wheel="$(find dist -name '*.whl' -print -quit)"
          wheel-smoke/bin/python -m pip install "${wheel}[mcp]"
          wheel-smoke/bin/python -c "import codegraph"
          wheel-smoke/bin/graphcodemap --help
          wheel-smoke/bin/graphcodemap-mcp --help
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write        # required for Trusted Publishing (OIDC)
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
