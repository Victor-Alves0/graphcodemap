name: release

# Publishes to PyPI via Trusted Publishing (OIDC) — no API token stored anywhere.
# One-time setup on PyPI: project → Settings → Publishing → add a GitHub trusted
# publisher (owner: Victor-Alves0, repo: graphcodemap, workflow: release.yml,
# environment: pypi). After that, publishing a GitHub Release runs this job.

on:
  release:
    types: [published]
  workflow_dispatch:   # allow a manual run from the Actions tab

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write        # required for Trusted Publishing (OIDC)
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
