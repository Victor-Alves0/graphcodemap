name: tests

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,mcp,l1]"
      # --timeout: um deadlock (concorrência/LSP) falha alto em vez de travar o CI.
      # A suíte inclui as guardas de regressão: idempotência de arestas (anti-bloat),
      # ciclos do call graph e concorrência. Testes L1 por LSP externo se auto-pulam.
      - name: Run tests
        run: python -m pytest -q --timeout=180

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install quality toolchain
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,quality,mcp,l1]"
      - name: Lint production code
        run: python -m ruff check src
      - name: Progressive type check
        run: python -m mypy
      - name: Coverage gate
        run: |
          python -m coverage run -m pytest -q --timeout=180
          python -m coverage report
      - name: Build and validate distributions
        run: |
          python -m build
          python -m twine check dist/*
